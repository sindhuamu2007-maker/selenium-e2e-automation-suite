[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --html=reports/e2e_test_report.html --self-contained-html
markers =
    smoke: Quick sanity verification of core functionality
    regression: Comprehensive test execution
    security: Security and vulnerability verification
    e2e: End-to-end full user journeys
